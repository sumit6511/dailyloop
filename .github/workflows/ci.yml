name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Same credentials and port as docker-compose's postgres_test, so `npm run db:test:migrate`
      # and apps/api/.env.test work unchanged.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dailyloop_test
          POSTGRES_PASSWORD: dailyloop_test_password
          POSTGRES_DB: dailyloop_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dailyloop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate the test database
        run: npm run db:test:migrate

      - name: Test
        run: npm test

      - name: Build the web app
        run: npm run build

  browser:
    # Playwright in a real browser: screenshots and accessibility (apps/web/visual, mocked API),
    # then an end-to-end journey against the real API and database (apps/web/e2e). Same OS as
    # the machine the screenshot baselines were made on.
    runs-on: ubuntu-24.04
    # Installing Chromium's system packages (incl. the fallback fonts the baselines were made
    # with) is usually quick but has taken 8 minutes on a slow Ubuntu mirror.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dailyloop_test
          POSTGRES_PASSWORD: dailyloop_test_password
          POSTGRES_DB: dailyloop_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dailyloop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Install Chromium for Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Visual regression and accessibility tests
        run: npm run test:visual -w @dailyloop/web

      - name: Migrate and seed the end-to-end database
        run: npm run db:test:migrate && npm run db:seed
        env:
          DATABASE_URL: postgresql://dailyloop_test:dailyloop_test_password@localhost:5433/dailyloop_test

      - name: End-to-end smoke test
        run: npm run test:e2e -w @dailyloop/web

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
