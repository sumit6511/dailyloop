<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04060d" />
    <script src="/theme-init.js"></script>
    <meta
      name="description"
      content="DailyLoop — new puzzles every day. Play a few minutes. Beat your friends."
    />
    <!-- Link previews (chat apps, social sites). __SITE_URL__ is the public origin from
         VITE_SITE_URL at build time: most previewers only fetch absolute image URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DailyLoop" />
    <meta property="og:title" content="DailyLoop — six puzzles, every day" />
    <meta
      property="og:description"
      content="Words, numbers and logic in a few minutes a day. Keep your streak, beat your friends."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="DailyLoop: six puzzles every day — Connections, Word Guess, Number Puzzle, Logic Puzzle, Guess It and Pathway."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DailyLoop" />
    <!-- Only the icon font still comes from Google: its glyph subset is built per request. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=__MATERIAL_SYMBOLS_ICON_NAMES__&display=block"
      rel="stylesheet"
    />
    <title>DailyLoop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
