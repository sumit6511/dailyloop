services:
  postgres:
    image: postgres:16-alpine
    container_name: dailyloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dailyloop
      POSTGRES_PASSWORD: dailyloop_dev_password
      POSTGRES_DB: dailyloop
    ports:
      - "5432:5432"
    volumes:
      - dailyloop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailyloop"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    container_name: dailyloop-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: dailyloop_test
      POSTGRES_PASSWORD: dailyloop_test_password
      POSTGRES_DB: dailyloop_test
    ports:
      - "5433:5432"
    volumes:
      - dailyloop_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailyloop_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dailyloop_postgres_data:
  dailyloop_postgres_test_data:
