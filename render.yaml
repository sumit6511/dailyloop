databases:
  - name: dailyloop-db
    plan: free
    databaseName: dailyloop
    user: dailyloop

services:
  - type: web
    name: dailyloop-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run db:migrate:deploy && npm start -w @dailyloop/api
    # Fails (503) when the database is unreachable, so a new deploy only takes traffic once it can serve.
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dailyloop-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: APP_SECRET
        generateValue: true
      - key: DEFAULT_TIMEZONE
        value: Asia/Kathmandu
      - key: CRON_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: dailyloop-web
          property: host
      - key: WEB_APP_URL
        fromService:
          type: web
          name: dailyloop-web
          property: host

  - type: web
    name: dailyloop-web
    runtime: static
    buildCommand: npm install && npm run build -w @dailyloop/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: dailyloop-api
          property: host
    # Keep in sync with apps/web/security-headers.json (apps/api/src/deploy-config.test.ts checks it).
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
      # Vite content-hashes everything in /assets, so a file there never changes: cache it for
      # a year and skip revalidation. index.html (unhashed) keeps the default short caching.
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
