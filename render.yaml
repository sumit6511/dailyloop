databases:
  - name: dailyloop-db
    plan: free
    databaseName: dailyloop
    user: dailyloop

services:
  - type: web
    name: dailyloop-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run db:migrate:deploy && npm start -w @dailyloop/api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dailyloop-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: APP_SECRET
        generateValue: true
      - key: DEFAULT_TIMEZONE
        value: Asia/Kathmandu
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: dailyloop-web
          property: host
      - key: WEB_APP_URL
        fromService:
          type: web
          name: dailyloop-web
          property: host

  - type: web
    name: dailyloop-web
    runtime: static
    buildCommand: npm install && npm run build -w @dailyloop/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: dailyloop-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
